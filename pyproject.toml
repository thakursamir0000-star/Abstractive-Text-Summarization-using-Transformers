[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-summarization"
version = "2.0.0"
description = "Abstractive summarization of text of any length with BART, with a ROUGE evaluation and a Streamlit app"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Samir Thakur"}]
keywords = ["summarization", "nlp", "transformers", "bart", "rouge", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40,<6",
    "streamlit>=1.46",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = ["rouge_score>=0.1.2", "pandas>=2.0", "pyarrow>=14", "pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/thakursamir0000-star/Abstractive-Text-Summarization-using-Transformers"
Repository = "https://github.com/thakursamir0000-star/Abstractive-Text-Summarization-using-Transformers"
Issues = "https://github.com/thakursamir0000-star/Abstractive-Text-Summarization-using-Transformers/issues"

[tool.setuptools]
packages = ["src", "evaluation"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["fine_tuned_bart_model"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --tb=short"
markers = ["model: loads a tiny random BART from the Hugging Face Hub"]
