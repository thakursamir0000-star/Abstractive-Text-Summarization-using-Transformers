# Streamlit Configuration
[server]
port = 8501
headless = true

[client]
showErrorDetails = "type"
toolbarMode = "minimal"

[logger]
level = "info"

[theme]
base = "light"
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"
