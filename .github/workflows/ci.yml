name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Cache the tiny test model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-random-bart-v1
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t text-summarizer .
      - name: Start container and check health
        run: |
          docker run -d --name app -p 7860:7860 text-summarizer
          for i in $(seq 1 30); do
            if curl -fs http://localhost:7860/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: Runs as a non-root user
        run: test "$(docker exec app id -u)" = "1000"
